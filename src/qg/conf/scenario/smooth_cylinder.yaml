# @package _global_
# smooth cylinder

qg:
  grid:
    Nx: 512
    Ny: 512
    Lx: 12.566370614359172  # 4*pi
    Ly: 12.566370614359172  # 4*pi

  time:
    dt: 0.001 # 0.0005
    T: 100
    save_rate: 200 # 1024
  
  pde:
    nu: 5e-5
    friction: 0.0
    penalty: 1.25
  
  ic:
    function: randn
    energy: 0.01
    wavenumbers: [3.0, 5.0]
  
  mask:
    function: circular
    r: 5  # pi/5
    x_center: 0.25  # Position cylinder at 1/4 domain
    y_center: 0.5
    tol: 1e-3
    invert: true

  forcing:
    function: local_cosines
    A: [-1.0]
    kx: [1.0]
    ky: [1.0]
    cx: [0.5]
    cy: [0.5]
    w: 0.0
    sigma: [0.04]
