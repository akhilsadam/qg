# @package _global_
# AUTO-GENERATED: True free-slip (normal velocity 0) all 4 sides  x  four gyre    =  sin(2y)    (D=1,  E=2)
qg:
  grid:
    Nx: 256
    Ny: 256
    Lx: 6.283185307179586   # 2*pi
    Ly: 6.283185307179586   # 2*pi
    precision: float32

  time:
    dt: 0.00001             # 1e-5  (matches working config)
    T: 100.0                # ~1e7 steps  <-- TEST WITH T: 1 FIRST
    save_rate: 50000

  integrator:
    lms: AB2
    ex: Euler
    imex: CN2
    split_bc: false

  pde:
    mu: 0.1
    nu: 0.005               # 5e-3
    B: 5.0                  # beta
    nv: 1.0
    penalty: 1.25      # eta = penalty * dt ; keep > 1 for explicit stability
    friction: null
    free_slip: false
    closure_function: null
    closure: 0.0
    rossby_radius: null
    rpn: null

  ic:                       # start from rest (energy 0), like the working run
    function: randn
    energy: 0.0
    wavenumbers: [3.0, 5.0]
    seed: 27
    n_batch: 1

  mask: {function: border, width: 0.025}
  bc: {function: sponge-walls, sides: lrtb, width: 0.025, offset: 0.05, sponge: 4.0}
  
  forcing: {function: sine, A: 0, B: 0, C: 0, D: 1.0, E: 2.0, F: 0}

  flow: null
  fps: 20
  profile: false
